name: Release KVS master

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: txing-release-kvs-master-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_COMPONENT: kvs-master
  RELEASE_VERSION_FILE: release/versions/kvs-master
  RELEASE_TAG_PREFIX: kvs-master-v
  KVS_MASTER_BINARY: txing-board-kvs-master
  KVS_MASTER_ASSET: txing-board-kvs-master-linux-aarch64.tar.gz

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-24.04-arm
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      latest_release_version: ${{ steps.metadata.outputs.latest_release_version }}
      tag: ${{ steps.metadata.outputs.tag }}
      release_target: ${{ steps.metadata.outputs.release_target }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < "$RELEASE_VERSION_FILE")"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "$RELEASE_VERSION_FILE must contain a semantic version like x.y.z, got: $version" >&2
            exit 1
          fi
          version_major_num=$((10#${BASH_REMATCH[1]}))
          version_minor_num=$((10#${BASH_REMATCH[2]}))
          version_patch_num=$((10#${BASH_REMATCH[3]}))

          if [ "${GITHUB_REF_TYPE}" != "branch" ]; then
            echo "$RELEASE_COMPONENT release workflow must be run manually from a branch, got ref type: ${GITHUB_REF_TYPE}" >&2
            exit 1
          fi

          git fetch --tags --force origin
          latest_release_version=""
          latest_major_num=0
          latest_minor_num=0
          latest_patch_num=0
          while IFS= read -r tag; do
            candidate="${tag#$RELEASE_TAG_PREFIX}"
            if [[ ! "$candidate" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              continue
            fi
            candidate_major_num=$((10#${BASH_REMATCH[1]}))
            candidate_minor_num=$((10#${BASH_REMATCH[2]}))
            candidate_patch_num=$((10#${BASH_REMATCH[3]}))
            if [ -z "$latest_release_version" ] ||
              (( candidate_major_num > latest_major_num ||
                (candidate_major_num == latest_major_num && candidate_minor_num > latest_minor_num) ||
                (candidate_major_num == latest_major_num && candidate_minor_num == latest_minor_num && candidate_patch_num > latest_patch_num) )); then
              latest_release_version="$candidate"
              latest_major_num="$candidate_major_num"
              latest_minor_num="$candidate_minor_num"
              latest_patch_num="$candidate_patch_num"
            fi
          done < <(git tag --list "$RELEASE_TAG_PREFIX*")

          if [ -n "$latest_release_version" ] &&
            (( version_major_num < latest_major_num ||
              (version_major_num == latest_major_num && version_minor_num < latest_minor_num) ||
              (version_major_num == latest_major_num && version_minor_num == latest_minor_num && version_patch_num <= latest_patch_num) )); then
            echo "$RELEASE_VERSION_FILE version $version must be greater than latest $RELEASE_COMPONENT release tag ${RELEASE_TAG_PREFIX}${latest_release_version}." >&2
            exit 1
          fi

          tag="${RELEASE_TAG_PREFIX}${version}"
          release_target="$(git rev-parse HEAD)"

          {
            echo "### Txing $RELEASE_COMPONENT release"
            echo
            echo "- Component: \`$RELEASE_COMPONENT\`"
            echo "- Version file: \`$RELEASE_VERSION_FILE\`"
            echo "- Version: \`$version\`"
            if [ -n "$latest_release_version" ]; then
              echo "- Latest $RELEASE_COMPONENT release tag: \`${RELEASE_TAG_PREFIX}${latest_release_version}\`"
            else
              echo "- Latest $RELEASE_COMPONENT release tag: none"
            fi
            echo "- Tag: \`$tag\`"
            echo "- Commit: \`$release_target\`"
          } >>"$GITHUB_STEP_SUMMARY"

          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "latest_release_version=$latest_release_version" >>"$GITHUB_OUTPUT"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "release_target=$release_target" >>"$GITHUB_OUTPUT"

      - name: Reject existing immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; releases are immutable." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Release tag $TAG already exists; releases are immutable." >&2
            exit 1
          fi

  build:
    name: Build shared KVS master
    runs-on: ubuntu-24.04-arm
    needs: metadata

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Start pinned Alpine build container
        shell: bash
        run: |
          docker run -d --name board-build \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -v "$RUNNER_TEMP:$RUNNER_TEMP" \
            -w "$GITHUB_WORKSPACE" \
            docker.io/library/alpine:3.24.1 \
            tail -f /dev/null

      - name: Install pinned Alpine build dependencies
        shell: bash
        run: |
          docker exec -i board-build sh <<'EOF'
          set -eu
          test "$(cat /etc/alpine-release)" = "3.24.1"
          test "$(uname -m)" = "aarch64"
          apk add --no-cache \
            gcompat build-base cmake pkgconf git perl ca-certificates curl \
            curl-dev openssl-dev log4cplus-dev libsrtp-dev libusrsctp-dev \
            libwebsockets-dev zlib-dev libcamera-dev linux-headers \
            protobuf-dev protobuf grpc-dev grpc-plugins binutils file tar gzip
          git config --global --add safe.directory '*'
          EOF

      - name: Build and test shared KVS master
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          AWS_KVS_SDK_COMMIT: bb106510cf74edd2c24881c1ae94ceaa0083d15c
        shell: bash
        run: |
          docker exec -i \
            -e VERSION="$VERSION" \
            -e AWS_KVS_SDK_COMMIT="$AWS_KVS_SDK_COMMIT" \
            -e GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            -e RUNNER_TEMP="$RUNNER_TEMP" \
            -e KVS_MASTER_BINARY="$KVS_MASTER_BINARY" \
            board-build sh <<'EOF'
          set -eu
          source_dir="$GITHUB_WORKSPACE/devices/common/board/kvs_master"
          build_dir="$RUNNER_TEMP/build-$KVS_MASTER_BINARY"
          output="$RUNNER_TEMP/$KVS_MASTER_BINARY"
          openssl_libdir="$(pkg-config --variable=libdir openssl)"
          openssl_includedir="$(pkg-config --variable=includedir openssl)"
          cmake \
            -S "$source_dir" \
            -B "$build_dir" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DTXING_KVS_SYSTEM_CA_CERT_PATH="${TXING_BOARD_KVS_SYSTEM_CA_CERT_PATH:-/etc/ssl/certs/Starfield_Services_Root_Certificate_Authority_-_G2.pem}" \
            -DTXING_KVS_GRPC_BRIDGE=ON \
            -DTXING_AWS_KVS_WEBRTC_SDK_GIT_TAG="$AWS_KVS_SDK_COMMIT" \
            -DTXING_BOARD_KVS_MASTER_VERSION="$VERSION" \
            -DOPENSSL_USE_STATIC_LIBS=FALSE \
            -DOPENSSL_INCLUDE_DIR="$openssl_includedir" \
            -DOPENSSL_SSL_LIBRARY="$openssl_libdir/libssl.so" \
            -DOPENSSL_CRYPTO_LIBRARY="$openssl_libdir/libcrypto.so"
          cmake --build "$build_dir" --config Release
          ctest --test-dir "$build_dir" --output-on-failure
          install -m 755 "$build_dir/$KVS_MASTER_BINARY" "$output"

          actual_version="$("$output" --version)"
          expected_version="$KVS_MASTER_BINARY $VERSION"
          if [ "$actual_version" != "$expected_version" ]; then
            echo "Expected '$expected_version', got '$actual_version'." >&2
            exit 1
          fi
          EOF

      - name: Package and verify shared KVS master
        shell: bash
        run: |
          docker exec -i \
            -e KVS_MASTER_BINARY="$KVS_MASTER_BINARY" \
            -e KVS_MASTER_ASSET="$KVS_MASTER_ASSET" \
            -e GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            -e RUNNER_TEMP="$RUNNER_TEMP" \
            board-build sh <<'EOF'
          set -eu
          package_dir="$RUNNER_TEMP/package-$KVS_MASTER_BINARY"
          asset_path="$RUNNER_TEMP/$KVS_MASTER_ASSET"
          rm -rf "$package_dir"
          install -d "$package_dir"
          install -m 755 "$RUNNER_TEMP/$KVS_MASTER_BINARY" "$package_dir/$KVS_MASTER_BINARY"
          strip "$package_dir/$KVS_MASTER_BINARY"
          sh release/scripts/assert-board-musl.sh \
            "$package_dir/$KVS_MASTER_BINARY" musl-libcamera
          tar -C "$package_dir" -czf "$asset_path" "$KVS_MASTER_BINARY"
          archive_listing="$(tar -tzf "$asset_path")"
          if [ "$archive_listing" != "$KVS_MASTER_BINARY" ]; then
            echo "Expected $KVS_MASTER_ASSET to contain only root-level $KVS_MASTER_BINARY, got:" >&2
            printf '%s\n' "$archive_listing" >&2
            exit 1
          fi
          EOF

      - name: Upload shared KVS master
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.KVS_MASTER_ASSET }}
          path: ${{ runner.temp }}/${{ env.KVS_MASTER_ASSET }}
          if-no-files-found: error

  smoke:
    name: Cross-distro smoke
    runs-on: ubuntu-24.04-arm
    needs:
      - metadata
      - build

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download release asset
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true

      - name: Run cross-distro smoke
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_ASSETS_DIR: ${{ runner.temp }}/release-assets
          TXING_CONTAINER_CLI: docker
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="$RUNNER_TEMP/smoke-bin"
          rm -rf "$smoke_dir"
          install -d "$smoke_dir"
          tar -C "$smoke_dir" -xzf "$RELEASE_ASSETS_DIR/$KVS_MASTER_ASSET"
          sh release/scripts/smoke-board-cross-distro.sh \
            "$smoke_dir/$KVS_MASTER_BINARY" musl-libcamera "$KVS_MASTER_BINARY $VERSION"

  publish:
    name: Publish release
    runs-on: ubuntu-24.04-arm
    needs:
      - metadata
      - build
      - smoke

    steps:
      - name: Download release asset
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_TARGET: ${{ needs.metadata.outputs.release_target }}
          RELEASE_ASSETS_DIR: ${{ runner.temp }}/release-assets
        shell: bash
        run: |
          set -euo pipefail
          asset_path="$RELEASE_ASSETS_DIR/$KVS_MASTER_ASSET"
          if [ ! -s "$asset_path" ]; then
            echo "Missing release asset from build job: $asset_path" >&2
            exit 1
          fi

          notes_file="$(mktemp)"
          {
            echo "Txing shared board KVS master release."
            echo
            echo "- Component: $RELEASE_COMPONENT"
            echo "- Version: $VERSION"
            echo "- Tag: $TAG"
            echo "- Commit: $RELEASE_TARGET"
            echo "- Build image: docker.io/library/alpine:3.24.1"
            echo "- Asset: $KVS_MASTER_ASSET"
          } >"$notes_file"

          gh release create "$TAG" \
            "$asset_path" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_TARGET" \
            --title "$TAG" \
            --notes-file "$notes_file" \
            --latest=false
