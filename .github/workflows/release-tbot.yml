name: Release tbot

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: txing-release-tbot-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_COMPONENT: tbot
  RELEASE_VERSION_FILE: release/versions/tbot
  RELEASE_TAG_PREFIX: tbot-v
  TBOT_DAEMON_ASSET: txing-tbot-daemon-linux-aarch64.tar.gz
  MAVLINK_BINARY: txing-tbot-mavlink
  MAVLINK_ASSET: txing-tbot-mavlink-linux-aarch64.tar.gz
  ARDUPILOT_BINARY: txing-tbot-ardupilot
  ARDUPILOT_DEFAULTS: txing-tbot-ardupilot.defaults.parm
  ARDUPILOT_DIAGNOSTIC_DEFAULTS: txing-tbot-ardupilot.diagnostic.parm
  ARDUPILOT_ASSET: txing-tbot-ardupilot-linux-aarch64.tar.gz
  ARDUPILOT_SOURCE_ASSET: txing-tbot-ardupilot-source.tar.gz
  ARDUPILOT_SOURCE_ROOT: txing-tbot-ardupilot-source

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-24.04-arm
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      release_target: ${{ steps.metadata.outputs.release_target }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < "$RELEASE_VERSION_FILE")"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "$RELEASE_VERSION_FILE must contain a semantic version like x.y.z, got: $version" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" != "branch" ]; then
            echo "$RELEASE_COMPONENT release workflow must be run manually from a branch, got ref type: ${GITHUB_REF_TYPE}" >&2
            exit 1
          fi
          git fetch --tags --force origin
          latest=""
          for tag in $(git tag --list "$RELEASE_TAG_PREFIX*"); do
            candidate="${tag#$RELEASE_TAG_PREFIX}"
            if [[ "$candidate" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] && { [ -z "$latest" ] || [ "$(printf '%s\n%s\n' "$latest" "$candidate" | sort -V | tail -1)" = "$candidate" ]; }; then
              latest="$candidate"
            fi
          done
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -1)" != "$version" ]; then
            echo "$RELEASE_VERSION_FILE version $version must be greater than latest $RELEASE_COMPONENT release tag ${RELEASE_TAG_PREFIX}${latest}." >&2
            exit 1
          fi
          tag="${RELEASE_TAG_PREFIX}${version}"
          release_target="$(git rev-parse HEAD)"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "release_target=$release_target" >>"$GITHUB_OUTPUT"

      - name: Reject existing immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; releases are immutable." >&2
            exit 1
          fi

  build:
    name: Build static board artifacts
    runs-on: ubuntu-24.04-arm
    needs: metadata
    steps:
      - uses: actions/checkout@v6

      - name: Build, test, package, and verify artifacts
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RUNNER_TEMP:$RUNNER_TEMP" \
            -w /workspace \
            -e MAVLINK_BINARY \
            -e MAVLINK_ASSET \
            -e VERSION \
            -e RUNNER_TEMP \
            docker.io/library/alpine:3.24.1 sh -se <<'EOF'
          set -eu
          test "$(cat /etc/alpine-release)" = "3.24.1"
          test "$(uname -m)" = "aarch64"
          # protobuf-dev supplies protoc's well-known .proto includes, including
          # google/protobuf/timestamp.proto imported by the board-video contract.
          apk add --no-cache git ca-certificates protobuf-dev protobuf go binutils file tar gzip

          daemon_module=github.com/mparkachov/txing/devices/common/board/daemon
          plugin_dir="$RUNNER_TEMP/tbot-protoc-plugins"
          GOBIN="$plugin_dir" go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10
          GOBIN="$plugin_dir" go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          proto_root=devices/common/board/proto
          out_dir=devices/common/board/daemon/internal/proto
          rm -rf "$out_dir"
          install -d "$out_dir"
          PATH="$plugin_dir:$PATH" protoc --proto_path="$proto_root" \
            --go_out="$out_dir" --go_opt=module="$daemon_module/internal/proto" \
            --go_opt=Mtxing/board/hardware/v1/hardware.proto="$daemon_module/internal/proto/hardwarev1" \
            --go_opt=Mtxing/board/board_video/v1/board_video.proto="$daemon_module/internal/proto/boardvideov1" \
            --go_opt=Mtxing/board/mavlink/v1/mavlink.proto="$daemon_module/internal/proto/mavlinkv1" \
            --go_opt=Mtxing/board/mavlink_bridge/v1/mavlink_bridge.proto="$daemon_module/internal/proto/mavlinkbridgev1" \
            --go-grpc_out="$out_dir" --go-grpc_opt=module="$daemon_module/internal/proto" \
            --go-grpc_opt=Mtxing/board/hardware/v1/hardware.proto="$daemon_module/internal/proto/hardwarev1" \
            --go-grpc_opt=Mtxing/board/board_video/v1/board_video.proto="$daemon_module/internal/proto/boardvideov1" \
            --go-grpc_opt=Mtxing/board/mavlink/v1/mavlink.proto="$daemon_module/internal/proto/mavlinkv1" \
            --go-grpc_opt=Mtxing/board/mavlink_bridge/v1/mavlink_bridge.proto="$daemon_module/internal/proto/mavlinkbridgev1" \
            txing/board/hardware/v1/hardware.proto txing/board/board_video/v1/board_video.proto \
            txing/board/mavlink/v1/mavlink.proto txing/board/mavlink_bridge/v1/mavlink_bridge.proto

          daemon_bin="$RUNNER_TEMP/txing-tbot-daemon"
          (cd devices/common/board/daemon && GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go test ./... && GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags="-s -w -X github.com/mparkachov/txing/devices/common/board/daemon/internal/daemon.DeviceType=tbot -X github.com/mparkachov/txing/devices/common/board/daemon/internal/daemon.DaemonVersion=$VERSION" -o "$daemon_bin" ./cmd/txing-board-daemon)

          mavlink_bin="$RUNNER_TEMP/$MAVLINK_BINARY"
          (cd devices/common/board/daemon && GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags="-s -w -X github.com/mparkachov/txing/devices/common/board/daemon/internal/daemon.DeviceType=tbot -X github.com/mparkachov/txing/devices/common/board/daemon/internal/daemon.DaemonVersion=$VERSION" -o "$mavlink_bin" ./cmd/txing-board-mavlink)

          for pair in "$daemon_bin:txing-tbot-daemon:txing-tbot-daemon-linux-aarch64.tar.gz" "$mavlink_bin:$MAVLINK_BINARY:$MAVLINK_ASSET"; do
            source="${pair%%:*}"; rest="${pair#*:}"; binary="${rest%%:*}"; asset="${rest#*:}"
            test "$("$source" --version)" = "$binary $VERSION"
            package="$RUNNER_TEMP/package-$binary"
            rm -rf "$package"; install -d "$package"; install -m 755 "$source" "$package/$binary"; strip "$package/$binary"
            sh release/scripts/assert-board-musl.sh "$package/$binary" static
            tar -C "$package" -czf "$RUNNER_TEMP/$asset" "$binary"
            test "$(tar -tzf "$RUNNER_TEMP/$asset")" = "$binary"
          done
          EOF

      - uses: actions/upload-artifact@v7
        with:
          name: tbot-board-assets
          path: |
            ${{ runner.temp }}/txing-tbot-daemon-linux-aarch64.tar.gz
            ${{ runner.temp }}/txing-tbot-mavlink-linux-aarch64.tar.gz
          if-no-files-found: error

  ardupilot:
    name: Build TBot ArduPilot
    runs-on: ubuntu-24.04-arm
    needs: metadata
    outputs:
      upstream_sha: ${{ steps.upstream.outputs.sha }}

    steps:
      - uses: actions/checkout@v6

      - name: Build, package, and verify ArduPilot
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -v "$RUNNER_TEMP:$RUNNER_TEMP" \
            -w "$GITHUB_WORKSPACE" \
            -e ARDUPILOT_BINARY \
            -e ARDUPILOT_DEFAULTS \
            -e ARDUPILOT_DIAGNOSTIC_DEFAULTS \
            -e ARDUPILOT_ASSET \
            -e ARDUPILOT_SOURCE_ASSET \
            -e ARDUPILOT_SOURCE_ROOT \
            -e GITHUB_WORKSPACE \
            -e RUNNER_TEMP \
            docker.io/library/alpine:3.24.1 sh -se <<'EOF'
          set -eu
          set -o pipefail

          test "$(cat /etc/alpine-release)" = "3.24.1"
          test "$(uname -m)" = "aarch64"
          apk add --no-cache ca-certificates file binutils git tar

          source_dir="$RUNNER_TEMP/ardupilot"
          source_package_dir="$RUNNER_TEMP/$ARDUPILOT_SOURCE_ROOT"
          binary_package_dir="$RUNNER_TEMP/package-$ARDUPILOT_BINARY"
          source_asset="$RUNNER_TEMP/$ARDUPILOT_SOURCE_ASSET"
          binary_asset="$RUNNER_TEMP/$ARDUPILOT_ASSET"
          patch="$GITHUB_WORKSPACE/devices/tbot/ardupilot/patches/0001-linux-tbot-sysfs-pwm.patch"
          defaults_source="$GITHUB_WORKSPACE/devices/tbot/ardupilot/defaults.parm"
          diagnostic_defaults_source="$GITHUB_WORKSPACE/devices/tbot/ardupilot/diagnostic.parm"
          hwdef_source="$GITHUB_WORKSPACE/devices/tbot/ardupilot/hwdef.dat"

          test ! -e "$source_dir"
          test ! -e "$source_package_dir"
          test ! -e "$binary_package_dir"
          git clone --recurse-submodules --single-branch --branch master \
            https://github.com/ArduPilot/ardupilot.git "$source_dir"
          cd "$source_dir"
          git apply --check "$patch"
          git apply "$patch"
          git rev-parse HEAD >"$RUNNER_TEMP/ardupilot-upstream-sha"
          if git submodule status --recursive | grep -E '^[+-]' >/dev/null; then
            echo "ArduPilot checkout has uninitialized or mismatched submodules." >&2
            exit 1
          fi
          test -f COPYING.txt
          test -f BUILD.md

          install -d "$source_package_dir"
          tar -C "$source_dir" --exclude-vcs -cf - . | \
            tar -C "$source_package_dir" -xf -
          tar -C "$RUNNER_TEMP" -czf "$source_asset" "$ARDUPILOT_SOURCE_ROOT"
          source_listing="$RUNNER_TEMP/ardupilot-source-archive-listing"
          tar -tzf "$source_asset" >"$source_listing"
          if grep -Ev "^$ARDUPILOT_SOURCE_ROOT/" "$source_listing" >/dev/null; then
            echo "$ARDUPILOT_SOURCE_ASSET contains an unexpected archive root." >&2
            exit 1
          fi
          grep -Fx "$ARDUPILOT_SOURCE_ROOT/COPYING.txt" "$source_listing"
          grep -Fx "$ARDUPILOT_SOURCE_ROOT/BUILD.md" "$source_listing"
          grep -F "$ARDUPILOT_SOURCE_ROOT/modules/ChibiOS/" "$source_listing" >/dev/null

          ./Tools/environment_install/install-prereqs-alpine.sh
          ./waf configure --board linux --extra-hwdef "$hwdef_source" \
            --static --define CANARD_64_BIT=1
          ./waf rover

          install -d "$binary_package_dir"
          install -m 755 build/linux/bin/ardurover \
            "$binary_package_dir/$ARDUPILOT_BINARY"
          install -m 644 "$defaults_source" \
            "$binary_package_dir/$ARDUPILOT_DEFAULTS"
          install -m 644 "$diagnostic_defaults_source" \
            "$binary_package_dir/$ARDUPILOT_DIAGNOSTIC_DEFAULTS"
          strip "$binary_package_dir/$ARDUPILOT_BINARY"
          sh "$GITHUB_WORKSPACE/release/scripts/assert-board-musl.sh" \
            "$binary_package_dir/$ARDUPILOT_BINARY" static
          "$binary_package_dir/$ARDUPILOT_BINARY" --help >/dev/null
          tar -C "$binary_package_dir" -czf "$binary_asset" \
            "$ARDUPILOT_BINARY" "$ARDUPILOT_DEFAULTS" "$ARDUPILOT_DIAGNOSTIC_DEFAULTS"
          archive_listing="$(tar -tzf "$binary_asset")"
          expected_listing="$(printf '%s\n%s\n%s' "$ARDUPILOT_BINARY" "$ARDUPILOT_DEFAULTS" "$ARDUPILOT_DIAGNOSTIC_DEFAULTS")"
          if [ "$archive_listing" != "$expected_listing" ]; then
            echo "Expected $ARDUPILOT_ASSET to contain root-level executable and defaults, got:" >&2
            printf '%s\n' "$archive_listing" >&2
            exit 1
          fi
          EOF

      - name: Resolve ArduPilot upstream SHA
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          upstream_sha="$(tr -d '[:space:]' < "$RUNNER_TEMP/ardupilot-upstream-sha")"
          if ! printf '%s\n' "$upstream_sha" | grep -E -q '^[0-9a-f]{40}$'; then
            echo "Expected a 40-character ArduPilot upstream SHA, got: $upstream_sha" >&2
            exit 1
          fi
          echo "sha=$upstream_sha" >>"$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARDUPILOT_ASSET }}
          path: ${{ runner.temp }}/${{ env.ARDUPILOT_ASSET }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARDUPILOT_SOURCE_ASSET }}
          path: ${{ runner.temp }}/${{ env.ARDUPILOT_SOURCE_ASSET }}
          if-no-files-found: error

  smoke:
    name: Cross-distro smoke
    runs-on: ubuntu-24.04-arm
    needs: [metadata, build, ardupilot]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true
      - env:
          VERSION: ${{ needs.metadata.outputs.version }}
          TXING_CONTAINER_CLI: docker
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="$RUNNER_TEMP/smoke-bin"
          install -d "$smoke_dir"
          tar -C "$smoke_dir" -xzf "$RUNNER_TEMP/release-assets/$TBOT_DAEMON_ASSET"
          tar -C "$smoke_dir" -xzf "$RUNNER_TEMP/release-assets/$MAVLINK_ASSET"
          sh release/scripts/smoke-board-cross-distro.sh "$smoke_dir/txing-tbot-daemon" static "txing-tbot-daemon $VERSION"
          sh release/scripts/smoke-board-cross-distro.sh "$smoke_dir/$MAVLINK_BINARY" static "$MAVLINK_BINARY $VERSION"

      - name: Run Alpine ArduPilot smoke
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            -v "$RUNNER_TEMP:$RUNNER_TEMP" \
            -w "$GITHUB_WORKSPACE" \
            -e ARDUPILOT_BINARY \
            -e ARDUPILOT_DEFAULTS \
            -e ARDUPILOT_DIAGNOSTIC_DEFAULTS \
            -e ARDUPILOT_ASSET \
            -e ARDUPILOT_SOURCE_ASSET \
            -e ARDUPILOT_SOURCE_ROOT \
            -e GITHUB_WORKSPACE \
            -e RUNNER_TEMP \
            docker.io/library/alpine:3.24.1 sh -se <<'EOF'
          set -eu

          test "$(cat /etc/alpine-release)" = "3.24.1"
          test "$(uname -m)" = "aarch64"
          apk add --no-cache file binutils
          smoke_dir="$RUNNER_TEMP/smoke-ardupilot"
          test ! -e "$smoke_dir"
          install -d "$smoke_dir"
          tar -C "$smoke_dir" -xzf "$RUNNER_TEMP/release-assets/$ARDUPILOT_ASSET"
          sh release/scripts/assert-board-musl.sh \
            "$smoke_dir/$ARDUPILOT_BINARY" static
          "$smoke_dir/$ARDUPILOT_BINARY" --help >/dev/null
          cmp "$smoke_dir/$ARDUPILOT_DEFAULTS" \
            "$GITHUB_WORKSPACE/devices/tbot/ardupilot/defaults.parm"
          cmp "$smoke_dir/$ARDUPILOT_DIAGNOSTIC_DEFAULTS" \
            "$GITHUB_WORKSPACE/devices/tbot/ardupilot/diagnostic.parm"

          source_listing="$RUNNER_TEMP/smoke-ardupilot-source-archive-listing"
          tar -tzf "$RUNNER_TEMP/release-assets/$ARDUPILOT_SOURCE_ASSET" >"$source_listing"
          if grep -Ev "^$ARDUPILOT_SOURCE_ROOT/" "$source_listing" >/dev/null; then
            echo "$ARDUPILOT_SOURCE_ASSET contains an unexpected archive root." >&2
            exit 1
          fi
          grep -Fx "$ARDUPILOT_SOURCE_ROOT/COPYING.txt" "$source_listing"
          grep -Fx "$ARDUPILOT_SOURCE_ROOT/BUILD.md" "$source_listing"
          grep -F "$ARDUPILOT_SOURCE_ROOT/modules/ChibiOS/" "$source_listing" >/dev/null
          EOF

  publish:
    name: Publish release
    runs-on: ubuntu-24.04-arm
    needs: [metadata, build, ardupilot, smoke]
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_TARGET: ${{ needs.metadata.outputs.release_target }}
          ARDUPILOT_UPSTREAM_SHA: ${{ needs.ardupilot.outputs.upstream_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$ARDUPILOT_UPSTREAM_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected a 40-character ArduPilot upstream SHA, got: $ARDUPILOT_UPSTREAM_SHA" >&2
            exit 1
          fi
          assets=(
            "$RUNNER_TEMP/release-assets/$TBOT_DAEMON_ASSET"
            "$RUNNER_TEMP/release-assets/$MAVLINK_ASSET"
            "$RUNNER_TEMP/release-assets/$ARDUPILOT_ASSET"
            "$RUNNER_TEMP/release-assets/$ARDUPILOT_SOURCE_ASSET"
          )
          for asset in "${assets[@]}"; do test -s "$asset"; done

          notes_file="$(mktemp)"
          {
            echo "Txing $RELEASE_COMPONENT release."
            echo
            echo "- Component: $RELEASE_COMPONENT"
            echo "- Version: $VERSION"
            echo "- Tag: $TAG"
            echo "- Commit: $RELEASE_TARGET"
            echo "- Build image: docker.io/library/alpine:3.24.1"
            echo "- ArduPilot upstream SHA: $ARDUPILOT_UPSTREAM_SHA"
            echo "- Assets:"
            for asset in "$TBOT_DAEMON_ASSET" "$MAVLINK_ASSET" "$ARDUPILOT_ASSET" "$ARDUPILOT_SOURCE_ASSET"; do
              echo "  - $asset"
            done
          } >"$notes_file"

          gh release create "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_TARGET" --title "$TAG" --notes-file "$notes_file" --latest=false
