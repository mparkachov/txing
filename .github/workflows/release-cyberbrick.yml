name: Release cyberbrick

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: txing-release-cyberbrick-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_COMPONENT: cyberbrick
  RELEASE_VERSION_FILE: release/versions/cyberbrick
  RELEASE_TAG_PREFIX: cyberbrick-v
  CYBERBRICK_DAEMON_ASSET: txing-cyberbrick-daemon-linux-aarch64.tar.gz
  MAVLINK_BINARY: txing-cyberbrick-mavlink
  MAVLINK_ASSET: txing-cyberbrick-mavlink-linux-aarch64.tar.gz
  ARDUPILOT_BINARY: txing-cyberbrick-ardupilot
  ARDUPILOT_DEFAULTS: txing-cyberbrick-ardupilot.defaults.parm
  ARDUPILOT_ASSET: txing-cyberbrick-ardupilot-linux-aarch64.tar.gz
  ARDUPILOT_SOURCE_ASSET: txing-cyberbrick-ardupilot-source.tar.gz
  ARDUPILOT_SOURCE_ROOT: txing-cyberbrick-ardupilot-source

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-24.04-arm
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      latest_release_version: ${{ steps.metadata.outputs.latest_release_version }}
      tag: ${{ steps.metadata.outputs.tag }}
      release_target: ${{ steps.metadata.outputs.release_target }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < "$RELEASE_VERSION_FILE")"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "$RELEASE_VERSION_FILE must contain a semantic version like x.y.z, got: $version" >&2
            exit 1
          fi
          version_major_num=$((10#${BASH_REMATCH[1]}))
          version_minor_num=$((10#${BASH_REMATCH[2]}))
          version_patch_num=$((10#${BASH_REMATCH[3]}))

          if [ "${GITHUB_REF_TYPE}" != "branch" ]; then
            echo "$RELEASE_COMPONENT release workflow must be run manually from a branch, got ref type: ${GITHUB_REF_TYPE}" >&2
            exit 1
          fi

          git fetch --tags --force origin
          latest_release_version=""
          latest_major_num=0
          latest_minor_num=0
          latest_patch_num=0
          while IFS= read -r tag; do
            candidate="${tag#$RELEASE_TAG_PREFIX}"
            if [[ ! "$candidate" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              continue
            fi
            candidate_major_num=$((10#${BASH_REMATCH[1]}))
            candidate_minor_num=$((10#${BASH_REMATCH[2]}))
            candidate_patch_num=$((10#${BASH_REMATCH[3]}))
            if [ -z "$latest_release_version" ] ||
              (( candidate_major_num > latest_major_num ||
                (candidate_major_num == latest_major_num && candidate_minor_num > latest_minor_num) ||
                (candidate_major_num == latest_major_num && candidate_minor_num == latest_minor_num && candidate_patch_num > latest_patch_num) )); then
              latest_release_version="$candidate"
              latest_major_num="$candidate_major_num"
              latest_minor_num="$candidate_minor_num"
              latest_patch_num="$candidate_patch_num"
            fi
          done < <(git tag --list "$RELEASE_TAG_PREFIX*")

          if [ -n "$latest_release_version" ] &&
            (( version_major_num < latest_major_num ||
              (version_major_num == latest_major_num && version_minor_num < latest_minor_num) ||
              (version_major_num == latest_major_num && version_minor_num == latest_minor_num && version_patch_num <= latest_patch_num) )); then
            echo "$RELEASE_VERSION_FILE version $version must be greater than latest $RELEASE_COMPONENT release tag ${RELEASE_TAG_PREFIX}${latest_release_version}." >&2
            exit 1
          fi

          tag="${RELEASE_TAG_PREFIX}${version}"
          release_target="$(git rev-parse HEAD)"

          {
            echo "### Txing $RELEASE_COMPONENT release"
            echo
            echo "- Component: \`$RELEASE_COMPONENT\`"
            echo "- Version file: \`$RELEASE_VERSION_FILE\`"
            echo "- Version: \`$version\`"
            if [ -n "$latest_release_version" ]; then
              echo "- Latest $RELEASE_COMPONENT release tag: \`${RELEASE_TAG_PREFIX}${latest_release_version}\`"
            else
              echo "- Latest $RELEASE_COMPONENT release tag: none"
            fi
            echo "- Tag: \`$tag\`"
            echo "- Commit: \`$release_target\`"
          } >>"$GITHUB_STEP_SUMMARY"

          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "latest_release_version=$latest_release_version" >>"$GITHUB_OUTPUT"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "release_target=$release_target" >>"$GITHUB_OUTPUT"

      - name: Reject existing immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; releases are immutable." >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Release tag $TAG already exists; releases are immutable." >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.binary }}
    runs-on: ubuntu-24.04-arm
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: daemon
            binary: txing-cyberbrick-daemon
            asset: txing-cyberbrick-daemon-linux-aarch64.tar.gz
            kind: static
          - component: mavlink
            binary: txing-cyberbrick-mavlink
            asset: txing-cyberbrick-mavlink-linux-aarch64.tar.gz
            kind: static

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # JavaScript actions cannot run inside musl containers on arm64
      # runners, so the job runs on the host and drives the pinned Alpine
      # build container through docker exec. Workspace and temp are mounted
      # at their host paths so step bodies see identical locations.
      - name: Start pinned Alpine build container
        shell: bash
        run: |
          docker run -d --name board-build \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -v "$RUNNER_TEMP:$RUNNER_TEMP" \
            -w "$GITHUB_WORKSPACE" \
            docker.io/library/alpine:3.24.1 \
            tail -f /dev/null

      - name: Install pinned Alpine build dependencies
        shell: bash
        run: |
          docker exec -i board-build sh <<'EOF'
          set -eu
          test "$(cat /etc/alpine-release)" = "3.24.1"
          test "$(uname -m)" = "aarch64"
          apk add --no-cache \
            gcompat build-base cmake pkgconf git perl ca-certificates curl \
            curl-dev openssl-dev openssl-libs-static log4cplus-dev libsrtp-dev \
            libusrsctp-dev libwebsockets-dev zlib-dev zlib-static libcamera-dev \
            linux-headers protobuf-dev protobuf grpc-dev grpc-plugins \
            go binutils file tar gzip
          git config --global --add safe.directory '*'
          EOF

      - name: Build and test ${{ matrix.binary }}
        env:
          COMPONENT: ${{ matrix.component }}
          BINARY: ${{ matrix.binary }}
          VERSION: ${{ needs.metadata.outputs.version }}
          PROTOC_GEN_GO_VERSION: v1.36.10
          PROTOC_GEN_GO_GRPC_VERSION: v1.5.1
        shell: bash
        run: |
          docker exec -i \
            -e COMPONENT="$COMPONENT" \
            -e BINARY="$BINARY" \
            -e VERSION="$VERSION" \
            -e PROTOC_GEN_GO_VERSION="$PROTOC_GEN_GO_VERSION" \
            -e PROTOC_GEN_GO_GRPC_VERSION="$PROTOC_GEN_GO_GRPC_VERSION" \
            -e GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            -e RUNNER_TEMP="$RUNNER_TEMP" \
            board-build sh <<'EOF'
          set -eu
          output="$RUNNER_TEMP/$BINARY"

          case "$COMPONENT" in
            daemon|mavlink)
              # The daemon's Go bindings are generated here rather than
              # checked in, matching how the C++ workers get theirs.
              plugin_dir="$RUNNER_TEMP/protoc-plugins"
              GOBIN="$plugin_dir" go install "google.golang.org/protobuf/cmd/protoc-gen-go@$PROTOC_GEN_GO_VERSION"
              GOBIN="$plugin_dir" go install "google.golang.org/grpc/cmd/protoc-gen-go-grpc@$PROTOC_GEN_GO_GRPC_VERSION"
              proto_root="$GITHUB_WORKSPACE/devices/common/board/proto"
              out_dir="$GITHUB_WORKSPACE/devices/common/board/daemon/internal/proto"
              hardware_proto="txing/board/hardware/v1/hardware.proto"
              board_video_proto="txing/board/board_video/v1/board_video.proto"
              mavlink_proto="txing/board/mavlink/v1/mavlink.proto"
              mavlink_bridge_proto="txing/board/mavlink_bridge/v1/mavlink_bridge.proto"
              rm -rf "$out_dir"
              install -d "$out_dir"
              PATH="$plugin_dir:$PATH" protoc \
                "--proto_path=$proto_root" \
                "--go_out=$out_dir" \
                "--go_opt=module=github.com/mparkachov/txing/devices/common/board/daemon/internal/proto" \
                "--go_opt=M$hardware_proto=github.com/mparkachov/txing/devices/common/board/daemon/internal/proto/hardwarev1" \
                "--go_opt=M$board_video_proto=github.com/mparkachov/txing/devices/common/board/daemon/internal/proto/boardvideov1" \
                "--go_opt=M$mavlink_proto=github.com/mparkachov/txing/devices/common/board/daemon/internal/proto/mavlinkv1" \
                "--go_opt=M$mavlink_bridge_proto=github.com/mparkachov/txing/devices/common/board/daemon/internal/proto/mavlinkbridgev1" \
                "--go-grpc_out=$out_dir" \
                "--go-grpc_opt=module=github.com/mparkachov/txing/devices/common/board/daemon/internal/proto" \
                "--go-grpc_opt=M$hardware_proto=github.com/mparkachov/txing/devices/common/board/daemon/internal/proto/hardwarev1" \
                "--go-grpc_opt=M$board_video_proto=github.com/mparkachov/txing/devices/common/board/daemon/internal/proto/boardvideov1" \
                "--go-grpc_opt=M$mavlink_proto=github.com/mparkachov/txing/devices/common/board/daemon/internal/proto/mavlinkv1" \
                "--go-grpc_opt=M$mavlink_bridge_proto=github.com/mparkachov/txing/devices/common/board/daemon/internal/proto/mavlinkbridgev1" \
                "$hardware_proto" \
                "$board_video_proto" \
                "$mavlink_proto" \
                "$mavlink_bridge_proto"
              case "$COMPONENT" in
                daemon) command=txing-board-daemon ;;
                mavlink) command=txing-board-mavlink ;;
              esac
              (
                cd devices/common/board/daemon
                GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go test ./...
                GOOS=linux GOARCH=arm64 CGO_ENABLED=0 \
                  go build -trimpath \
                    -ldflags="-s -w -X github.com/mparkachov/txing/devices/common/board/daemon/internal/daemon.DeviceType=cyberbrick -X github.com/mparkachov/txing/devices/common/board/daemon/internal/daemon.DaemonVersion=$VERSION" \
                    -o "$output" \
                    "./cmd/$command"
              )
              ;;
            *)
              echo "Unsupported Cyberbrick release component: $COMPONENT" >&2
              exit 2
              ;;
          esac

          test -x "$output"
          actual_version="$("$output" --version)"
          expected_version="$BINARY $VERSION"
          if [ "$actual_version" != "$expected_version" ]; then
            echo "Expected '$expected_version', got '$actual_version'." >&2
            exit 1
          fi
          EOF

      - name: Package and verify ${{ matrix.asset }}
        env:
          BINARY: ${{ matrix.binary }}
          ASSET: ${{ matrix.asset }}
          BINARY_KIND: ${{ matrix.kind }}
        shell: bash
        run: |
          docker exec -i \
            -e BINARY="$BINARY" \
            -e ASSET="$ASSET" \
            -e BINARY_KIND="$BINARY_KIND" \
            -e GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            -e RUNNER_TEMP="$RUNNER_TEMP" \
            board-build sh <<'EOF'
          set -eu
          source="$RUNNER_TEMP/$BINARY"
          package_dir="$RUNNER_TEMP/package-$BINARY"
          asset_path="$RUNNER_TEMP/$ASSET"
          rm -rf "$package_dir"
          install -d "$package_dir"
          install -m 755 "$source" "$package_dir/$BINARY"
          strip "$package_dir/$BINARY"
          sh release/scripts/assert-board-musl.sh \
            "$package_dir/$BINARY" "$BINARY_KIND"
          tar -C "$package_dir" -czf "$asset_path" "$BINARY"
          archive_listing="$(tar -tzf "$asset_path")"
          if [ "$archive_listing" != "$BINARY" ]; then
            echo "Expected $ASSET to contain only root-level $BINARY, got:" >&2
            printf '%s\n' "$archive_listing" >&2
            exit 1
          fi
          EOF

      - name: Upload ${{ matrix.asset }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ runner.temp }}/${{ matrix.asset }}
          if-no-files-found: error

  ardupilot:
    name: Build Cyberbrick ArduPilot
    runs-on: ubuntu-24.04-arm
    needs: metadata
    outputs:
      upstream_sha: ${{ steps.upstream.outputs.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Start pinned Alpine build container
        shell: bash
        run: |
          docker run -d --name ardupilot-build \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -v "$RUNNER_TEMP:$RUNNER_TEMP" \
            -w "$GITHUB_WORKSPACE" \
            docker.io/library/alpine:3.24.1 \
            tail -f /dev/null

      - name: Build and package ArduPilot
        shell: bash
        run: |
          docker exec -i \
            -e ARDUPILOT_BINARY="$ARDUPILOT_BINARY" \
            -e ARDUPILOT_DEFAULTS="$ARDUPILOT_DEFAULTS" \
            -e ARDUPILOT_ASSET="$ARDUPILOT_ASSET" \
            -e ARDUPILOT_SOURCE_ASSET="$ARDUPILOT_SOURCE_ASSET" \
            -e ARDUPILOT_SOURCE_ROOT="$ARDUPILOT_SOURCE_ROOT" \
            -e GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            -e RUNNER_TEMP="$RUNNER_TEMP" \
            ardupilot-build sh <<'EOF'
          set -eu

          test "$(cat /etc/alpine-release)" = "3.24.1"
          test "$(uname -m)" = "aarch64"
          apk add --no-cache ca-certificates file binutils git tar

          source_dir="$RUNNER_TEMP/ardupilot"
          source_package_dir="$RUNNER_TEMP/$ARDUPILOT_SOURCE_ROOT"
          binary_package_dir="$RUNNER_TEMP/package-$ARDUPILOT_BINARY"
          source_asset="$RUNNER_TEMP/$ARDUPILOT_SOURCE_ASSET"
          binary_asset="$RUNNER_TEMP/$ARDUPILOT_ASSET"
          defaults_source="$GITHUB_WORKSPACE/devices/cyberbrick/ardupilot/defaults.parm"

          test ! -e "$source_dir"
          test ! -e "$source_package_dir"
          test ! -e "$binary_package_dir"
          git clone --recurse-submodules --single-branch --branch master \
            https://github.com/ArduPilot/ardupilot.git "$source_dir"
          cd "$source_dir"
          git apply \
            "$GITHUB_WORKSPACE/devices/cyberbrick/ardupilot/patches/0001-linux-sysfs-pwm-subtype.patch" \
            "$GITHUB_WORKSPACE/devices/cyberbrick/ardupilot/patches/0002-linux-sysfs-pwm-no-imu.patch"
          git rev-parse HEAD >"$RUNNER_TEMP/ardupilot-upstream-sha"
          if git submodule status --recursive | grep -E '^[+-]' >/dev/null; then
            echo "ArduPilot checkout has uninitialized or mismatched submodules." >&2
            exit 1
          fi
          test -f COPYING.txt
          test -f BUILD.md

          install -d "$source_package_dir"
          cp -a "$source_dir/." "$source_package_dir/"
          rm -rf "$source_package_dir/.git"
          find "$source_package_dir" -type f -name .git -delete
          tar -C "$RUNNER_TEMP" -czf "$source_asset" "$ARDUPILOT_SOURCE_ROOT"
          if tar -tzf "$source_asset" | grep -Ev "^$ARDUPILOT_SOURCE_ROOT/" >/dev/null; then
            echo "$ARDUPILOT_SOURCE_ASSET contains an unexpected archive root." >&2
            exit 1
          fi
          tar -tzf "$source_asset" | grep -Fx "$ARDUPILOT_SOURCE_ROOT/COPYING.txt"
          tar -tzf "$source_asset" | grep -Fx "$ARDUPILOT_SOURCE_ROOT/BUILD.md"
          tar -tzf "$source_asset" | grep -F "$ARDUPILOT_SOURCE_ROOT/modules/ChibiOS/" >/dev/null

          ./Tools/environment_install/install-prereqs-alpine.sh
          ./waf configure --board linux \
            --extra-hwdef "$GITHUB_WORKSPACE/devices/cyberbrick/ardupilot/hwdef.dat" \
            --static --define CANARD_64_BIT=1
          ./waf rover

          install -d "$binary_package_dir"
          install -m 755 build/linux/bin/ardurover \
            "$binary_package_dir/$ARDUPILOT_BINARY"
          install -m 644 "$defaults_source" \
            "$binary_package_dir/$ARDUPILOT_DEFAULTS"
          strip "$binary_package_dir/$ARDUPILOT_BINARY"
          sh "$GITHUB_WORKSPACE/release/scripts/assert-board-musl.sh" \
            "$binary_package_dir/$ARDUPILOT_BINARY" static
          "$binary_package_dir/$ARDUPILOT_BINARY" --help >/dev/null
          tar -C "$binary_package_dir" -czf "$binary_asset" \
            "$ARDUPILOT_BINARY" "$ARDUPILOT_DEFAULTS"
          archive_listing="$(tar -tzf "$binary_asset")"
          expected_listing="$(printf '%s\n%s' "$ARDUPILOT_BINARY" "$ARDUPILOT_DEFAULTS")"
          if [ "$archive_listing" != "$expected_listing" ]; then
            echo "Expected $ARDUPILOT_ASSET to contain root-level executable and defaults, got:" >&2
            printf '%s\n' "$archive_listing" >&2
            exit 1
          fi
          EOF

      - name: Resolve ArduPilot upstream SHA
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          upstream_sha="$(tr -d '[:space:]' < "$RUNNER_TEMP/ardupilot-upstream-sha")"
          if ! printf '%s\n' "$upstream_sha" | grep -E -q '^[0-9a-f]{40}$'; then
            echo "Expected a 40-character ArduPilot upstream SHA, got: $upstream_sha" >&2
            exit 1
          fi
          echo "sha=$upstream_sha" >>"$GITHUB_OUTPUT"

      - name: Upload ${{ env.ARDUPILOT_ASSET }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARDUPILOT_ASSET }}
          path: ${{ runner.temp }}/${{ env.ARDUPILOT_ASSET }}
          if-no-files-found: error

      - name: Upload ${{ env.ARDUPILOT_SOURCE_ASSET }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARDUPILOT_SOURCE_ASSET }}
          path: ${{ runner.temp }}/${{ env.ARDUPILOT_SOURCE_ASSET }}
          if-no-files-found: error

  smoke:
    name: Cross-distro smoke
    runs-on: ubuntu-24.04-arm
    needs:
      - metadata
      - build
      - ardupilot

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true

      - name: Run cross-distro smoke
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_ASSETS_DIR: ${{ runner.temp }}/release-assets
          TXING_CONTAINER_CLI: docker
        shell: bash
        run: |
          set -euo pipefail

          smoke_dir="$RUNNER_TEMP/smoke-bin"
          rm -rf "$smoke_dir"
          install -d "$smoke_dir"
          tar -C "$smoke_dir" -xzf "$RELEASE_ASSETS_DIR/$CYBERBRICK_DAEMON_ASSET"
          tar -C "$smoke_dir" -xzf "$RELEASE_ASSETS_DIR/$MAVLINK_ASSET"

          sh release/scripts/smoke-board-cross-distro.sh \
            "$smoke_dir/txing-cyberbrick-daemon" static "txing-cyberbrick-daemon $VERSION"
          sh release/scripts/smoke-board-cross-distro.sh \
            "$smoke_dir/$MAVLINK_BINARY" static "$MAVLINK_BINARY $VERSION"

      - name: Run Alpine ArduPilot smoke
        env:
          RELEASE_ASSETS_DIR: ${{ runner.temp }}/release-assets
        shell: bash
        run: |
          docker run --rm -i \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            -v "$RUNNER_TEMP:$RUNNER_TEMP" \
            -w "$GITHUB_WORKSPACE" \
            -e ARDUPILOT_BINARY="$ARDUPILOT_BINARY" \
            -e ARDUPILOT_DEFAULTS="$ARDUPILOT_DEFAULTS" \
            -e ARDUPILOT_ASSET="$ARDUPILOT_ASSET" \
            -e ARDUPILOT_SOURCE_ASSET="$ARDUPILOT_SOURCE_ASSET" \
            -e ARDUPILOT_SOURCE_ROOT="$ARDUPILOT_SOURCE_ROOT" \
            -e RELEASE_ASSETS_DIR="$RELEASE_ASSETS_DIR" \
            -e GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            -e RUNNER_TEMP="$RUNNER_TEMP" \
            docker.io/library/alpine:3.24.1 \
            sh <<'EOF'
          set -eu

          test "$(cat /etc/alpine-release)" = "3.24.1"
          test "$(uname -m)" = "aarch64"
          apk add --no-cache file binutils
          smoke_dir="$RUNNER_TEMP/smoke-ardupilot"
          test ! -e "$smoke_dir"
          install -d "$smoke_dir"
          tar -C "$smoke_dir" -xzf "$RELEASE_ASSETS_DIR/$ARDUPILOT_ASSET"
          sh release/scripts/assert-board-musl.sh \
            "$smoke_dir/$ARDUPILOT_BINARY" static
          "$smoke_dir/$ARDUPILOT_BINARY" --help >/dev/null
          cmp "$smoke_dir/$ARDUPILOT_DEFAULTS" \
            "$GITHUB_WORKSPACE/devices/cyberbrick/ardupilot/defaults.parm"

          if tar -tzf "$RELEASE_ASSETS_DIR/$ARDUPILOT_SOURCE_ASSET" | \
            grep -Ev "^$ARDUPILOT_SOURCE_ROOT/" >/dev/null; then
            echo "$ARDUPILOT_SOURCE_ASSET contains an unexpected archive root." >&2
            exit 1
          fi
          tar -tzf "$RELEASE_ASSETS_DIR/$ARDUPILOT_SOURCE_ASSET" | \
            grep -Fx "$ARDUPILOT_SOURCE_ROOT/COPYING.txt"
          tar -tzf "$RELEASE_ASSETS_DIR/$ARDUPILOT_SOURCE_ASSET" | \
            grep -Fx "$ARDUPILOT_SOURCE_ROOT/BUILD.md"
          tar -tzf "$RELEASE_ASSETS_DIR/$ARDUPILOT_SOURCE_ASSET" | \
            grep -F "$ARDUPILOT_SOURCE_ROOT/modules/ChibiOS/" >/dev/null
          EOF

  publish:
    name: Publish release
    runs-on: ubuntu-24.04-arm
    needs:
      - metadata
      - build
      - ardupilot
      - smoke

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_TARGET: ${{ needs.metadata.outputs.release_target }}
          RELEASE_ASSETS_DIR: ${{ runner.temp }}/release-assets
          ARDUPILOT_UPSTREAM_SHA: ${{ needs.ardupilot.outputs.upstream_sha }}
        shell: bash
        run: |
          set -euo pipefail

          release_assets=(
            "$CYBERBRICK_DAEMON_ASSET"
            "$MAVLINK_ASSET"
            "$ARDUPILOT_ASSET"
            "$ARDUPILOT_SOURCE_ASSET"
          )

          release_asset_paths=()
          for asset in "${release_assets[@]}"; do
            asset_path="$RELEASE_ASSETS_DIR/$asset"
            if [ ! -s "$asset_path" ]; then
              echo "Missing release asset from build jobs: $asset_path" >&2
              find "$RELEASE_ASSETS_DIR" -maxdepth 2 -type f -print >&2 || true
              exit 1
            fi
            release_asset_paths+=("$asset_path")
          done

          notes_file="$(mktemp)"
          {
            echo "Txing $RELEASE_COMPONENT release."
            echo
            echo "- Component: $RELEASE_COMPONENT"
            echo "- Version: $VERSION"
            echo "- Tag: $TAG"
            echo "- Commit: $RELEASE_TARGET"
            echo "- Build image: docker.io/library/alpine:3.24.1"
            echo "- ArduPilot upstream SHA: $ARDUPILOT_UPSTREAM_SHA"
            echo "- Assets:"
            for asset in "${release_assets[@]}"; do
              echo "  - $asset"
            done
          } >"$notes_file"

          gh release create "$TAG" \
            "${release_asset_paths[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_TARGET" \
            --title "$TAG" \
            --notes-file "$notes_file" \
            --latest=false
