# Copy to the root of the FAT boot partition, then edit the three values below.
#
# Read by the headless bootstrap apkovl on first boot. Mandatory: without it the
# board has no network and cannot be reached.
#
# Must use LF line endings. A file saved with CRLF is silently ignored and the
# board comes up with no Wi-Fi, which looks identical to a wrong passphrase.

# Regulatory domain, ISO 3166-1 alpha-2. Wrong value can disable channels.
country=DE

ctrl_interface=/var/run/wpa_supplicant
update_config=1

network={
    ssid="REPLACE_WITH_DEPLOYMENT_SSID"
    psk="REPLACE_WITH_DEPLOYMENT_PASSPHRASE"
}
