AWSTemplateFormatVersion: "2010-09-09"
Description: txing cloud rig runtime Lambda stack.

Parameters:
  EnvironmentStackName:
    Type: String
    Description: txing environment stack prefix, for example town.
  LambdaArtifactsBucketName:
    Type: String
    Description: S3 bucket containing release-built Lambda bootstrap zip artifacts.
  CloudMcuTickQueueUrl:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /txing/stack/CloudMcuTickQueueUrl
  CloudMcuTickQueueArn:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /txing/stack/CloudMcuTickQueueArn
  CloudMcuRuntimeScheduleExpression:
    Type: String
    Default: rate(1 minute)

Resources:
  CloudRigLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${EnvironmentStackName}-cloud-rig
      RetentionInDays: 14

  CloudRigRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${EnvironmentStackName}-cloud-rig-runtime
      Description: Schedules cloud MCU SQS watch-link ticks for cloud rigs.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: cloud-rig-runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudRigRuntimeLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !GetAtt CloudRigLogGroup.Arn
                  - !Sub ${CloudRigLogGroup.Arn}:*
              - Sid: CloudRigRuntimeSparkplug
                Effect: Allow
                Action: iot:Publish
                Resource: !Sub arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/spBv1.0/*
              - Sid: CloudRigRuntimeFleetIndexing
                Effect: Allow
                Action: iot:SearchIndex
                Resource: "*"
              - Sid: CloudRigRuntimeDescribeThing
                Effect: Allow
                Action: iot:DescribeThing
                Resource: !Sub arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:thing/*
              - Sid: CloudRigRuntimeReadDeviceShadows
                Effect: Allow
                Action: iot:GetThingShadow
                Resource: !Sub arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:thing/*
              - Sid: CloudRigRuntimeDescribeEndpoint
                Effect: Allow
                Action: iot:DescribeEndpoint
                Resource: "*"
              - Sid: CloudRigRuntimeSqs
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !Ref CloudMcuTickQueueArn
              - Sid: CloudRigRuntimeScheduleControl
                Effect: Allow
                Action:
                  - scheduler:GetSchedule
                  - scheduler:UpdateSchedule
                Resource: !Sub arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/${EnvironmentStackName}-cloud-rig-runtime
              - Sid: CloudRigRuntimeSchedulePassRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudRigScheduleRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: scheduler.amazonaws.com

  CloudRigFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - CloudRigLogGroup
    Properties:
      FunctionName: !Sub ${EnvironmentStackName}-cloud-rig
      Description: EventBridge scheduler for cloud MCU SQS watch-link ticks.
      Runtime: provided.al2023
      Handler: bootstrap
      Architectures:
        - arm64
      Code:
        S3Bucket: !Ref LambdaArtifactsBucketName
        S3Key: lambda/txing-cloud-rig-lambda/current/bootstrap.zip
      Role: !GetAtt CloudRigRole.Arn
      Timeout: 60
      MemorySize: 128
      Environment:
        Variables:
          CLOUD_MCU_TICK_QUEUE_URL: !Ref CloudMcuTickQueueUrl
          CLOUD_RIG_SCHEDULE_NAME: !Sub ${EnvironmentStackName}-cloud-rig-runtime

  CloudRigScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${EnvironmentStackName}-cloud-rig-schedule
      Description: Lets EventBridge Scheduler invoke the cloud rig runtime Lambda.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: cloud-rig-schedule
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudRigScheduleInvoke
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${EnvironmentStackName}-cloud-rig

  CloudRigSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub ${EnvironmentStackName}-cloud-rig-runtime
      Description: Schedule cloud MCU watch-link ticks once per minute.
      GroupName: default
      ScheduleExpression: !Ref CloudMcuRuntimeScheduleExpression
      FlexibleTimeWindow:
        Mode: "OFF"
      State: ENABLED
      Target:
        Arn: !GetAtt CloudRigFunction.Arn
        RoleArn: !GetAtt CloudRigScheduleRole.Arn

  CloudRigNcmdTopicRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: !Join
        - "_"
        - - !Join
            - "_"
            - !Split ["-", !Ref EnvironmentStackName]
          - cloud_rig_ncmd
      TopicRulePayload:
        AwsIotSqlVersion: "2016-03-23"
        RuleDisabled: false
        Sql: >-
          SELECT topic() AS mqttTopic, encode(*, 'base64') AS payloadBase64, timestamp() AS observedAt
          FROM 'spBv1.0/+/NCMD/+'
          WHERE startswith(topic(4), 'cloud')
        Actions:
          - Lambda:
              FunctionArn: !GetAtt CloudRigFunction.Arn

  CloudRigNcmdRulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CloudRigFunction
      Principal: iot.amazonaws.com
      SourceArn: !GetAtt CloudRigNcmdTopicRule.Arn

  StackParameterCloudRigRuntimeFunctionName:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /txing/stack/CloudRigRuntimeFunctionName
      Type: String
      Value: !Ref CloudRigFunction

  StackParameterCloudRigRuntimeFunctionArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /txing/stack/CloudRigRuntimeFunctionArn
      Type: String
      Value: !GetAtt CloudRigFunction.Arn

  StackParameterCloudRigRuntimeScheduleName:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /txing/stack/CloudRigRuntimeScheduleName
      Type: String
      Value: !Sub ${EnvironmentStackName}-cloud-rig-runtime

  StackParameterCloudRigNcmdTopicRuleArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /txing/stack/CloudRigNcmdTopicRuleArn
      Type: String
      Value: !GetAtt CloudRigNcmdTopicRule.Arn

Outputs:
  CloudRigRuntimeFunctionName:
    Value: !Ref CloudRigFunction
  CloudRigRuntimeFunctionArn:
    Value: !GetAtt CloudRigFunction.Arn
  CloudRigRuntimeScheduleName:
    Value: !Sub ${EnvironmentStackName}-cloud-rig-runtime
  CloudRigNcmdTopicRuleArn:
    Value: !GetAtt CloudRigNcmdTopicRule.Arn
