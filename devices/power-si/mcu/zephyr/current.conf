# Silent SED current-measurement profile.
#
# Keep the validated SED-only recovery behavior and the minimum power-si
# contract (Thread, SRP, and CoAP). Initialize the UART and its board pinctrl as
# a focused current experiment, but keep every output producer disabled.
CONFIG_TXING_POWER_SI_SED_RECOVERY_TEST=y

CONFIG_PM=y
CONFIG_TICKLESS_KERNEL=y

CONFIG_LOG=n
# Keep USART0 initialized so PA8 drives the onboard SAMD11 RX input high.
# Leaving this board connection uninitialized raises the measured idle floor.
CONFIG_SERIAL=y
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
CONFIG_SHELL=n
CONFIG_NET_SHELL=n
CONFIG_OPENTHREAD_SHELL=n
CONFIG_OPENTHREAD_DEBUG=n
