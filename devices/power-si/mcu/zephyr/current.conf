# SED current-measurement profile.
#
# Keep this image silent and PM-enabled. Use the sed-debug profile first for
# functional evidence, then flash sed-current for current measurements.
CONFIG_PM=y
CONFIG_TICKLESS_KERNEL=y

CONFIG_LOG=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
