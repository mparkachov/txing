# Requested-link recovery experiment for the serial/shell candidate image.
#
# Once this image has transitioned from the receiver-on SRP bootstrap, a
# persistent attachment loss retries the requested SED-debug link mode.
# REDCON 3 requests receiver-on MTD and REDCON 4 requests SED.
CONFIG_TXING_POWER_SI_SED_RECOVERY_TEST=y
CONFIG_TXING_POWER_SI_SED_REDCON_LINK_MODE_TEST=y

# Enable the power-management path used for SED current and functional
# validation while retaining the serial shell. Report only changes in the
# selected EM1/EM2 sleep mode; routine EM0 wakeups are intentionally suppressed
# by the application diagnostic.
CONFIG_PM=y
CONFIG_TICKLESS_KERNEL=y
CONFIG_TXING_POWER_SI_PM_TRANSITION_DIAGNOSTICS=y
