# Silent final power-si SED release profile.
#
# This overlay is applied after sed-debug.conf so the final image keeps the
# validated Thread bootstrap, SRP, SED recovery, and REDCON rn/n link-mode
# behavior. It retains the same serial-driver baseline, but disables all
# user-visible diagnostics.

CONFIG_SERIAL=y
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
CONFIG_LOG=n
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_MODE_IMMEDIATE=n
CONFIG_SHELL=n
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_NET_SHELL=n
CONFIG_OPENTHREAD_SHELL=n
CONFIG_OPENTHREAD_DEBUG=n
CONFIG_TXING_POWER_SI_SRP_PSA_DIAGNOSTICS=n
CONFIG_TXING_POWER_SI_PM_TRANSITION_DIAGNOSTICS=n
CONFIG_ASSERT=n
CONFIG_THREAD_NAME=n
CONFIG_INIT_STACKS=n
CONFIG_STACK_SENTINEL=n

# Sample the XIAO MG24 battery divider only when a CoAP state response is
# requested. Device PM keeps the IADC suspended between samples.
CONFIG_ADC=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_SYSTEM_MANAGED=n
CONFIG_TXING_POWER_SI_BATTERY_REPORTING=y
