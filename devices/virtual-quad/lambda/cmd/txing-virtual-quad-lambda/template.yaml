AWSTemplateFormatVersion: "2010-09-09"
Description: On-demand virtual quadcopter sessions on standard ARM64 Lambda.

Parameters:
  EnvironmentStackName:
    Type: String
    AllowedPattern: '[A-Za-z][A-Za-z0-9-]{0,40}'
  LambdaArtifactsBucketName:
    Type: String

Rules:
  Frankfurt:
    Assertions:
      - Assert: !Equals [!Ref 'AWS::Region', eu-central-1]
        AssertDescription: The virtual quadcopter runtime uses eu-central-1.

Resources:
  ControllerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${EnvironmentStackName}-virtual-quad
      RetentionInDays: 14

  ControllerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: virtual-quad-session
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ['logs:CreateLogStream', 'logs:PutLogEvents']
                Resource: !GetAtt ControllerLogs.Arn
              - Effect: Allow
                Action: iot:DescribeEndpoint
                Resource: '*'
              - Effect: Allow
                Action: ['iot:DescribeThing', 'iot:GetThingShadow']
                Resource:
                  - !Sub arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:thing/cloud-*
                  - !Sub arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:thing/virtual-quad-*
              - Effect: Allow
                Action: iot:UpdateThingShadow
                Resource: !Sub arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:thing/virtual-quad-*
              - Effect: Allow
                Action: iot:Publish
                Resource: !Sub arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/spBv1.0/*/DDATA/cloud-*/virtual-quad-*
              - Effect: Allow
                Action: iot:Connect
                Resource: !Sub arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:client/quad-*
              - Effect: Allow
                Action: iot:Subscribe
                Resource:
                  - !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topicfilter/$aws/things/virtual-quad-*/shadow/name/simulation/update/documents'
                  - !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topicfilter/$aws/things/cloud-*/shadow/name/sparkplug/update/documents'
              - Effect: Allow
                Action: iot:Receive
                Resource:
                  - !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/$aws/things/virtual-quad-*/shadow/name/simulation/update/documents'
                  - !Sub 'arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/$aws/things/cloud-*/shadow/name/sparkplug/update/documents'
              - Effect: Allow
                Action:
                  - kinesisvideo:DescribeSignalingChannel
                  - kinesisvideo:GetSignalingChannelEndpoint
                  - kinesisvideo:GetIceServerConfig
                  - kinesisvideo:ConnectAsMaster
                Resource:
                  - !Sub arn:${AWS::Partition}:kinesisvideo:${AWS::Region}:${AWS::AccountId}:channel/virtual-quad-*-board-video/*
                  - !Sub arn:${AWS::Partition}:kinesisvideo:${AWS::Region}:${AWS::AccountId}:channel/virtual-quad-*-mavlink/*
              - Effect: Allow
                Action: events:PutEvents
                Resource: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/default

  Controller:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${EnvironmentStackName}-virtual-quad
      Runtime: provided.al2023
      Architectures: [arm64]
      Handler: bootstrap
      Role: !GetAtt ControllerRole.Arn
      Timeout: 900
      MemorySize: 3008
      Code:
        S3Bucket: !Ref LambdaArtifactsBucketName
        S3Key: lambda/txing-virtual-quad-lambda/current/bootstrap.zip

  InvocationConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref Controller
      Qualifier: '$LATEST'
      MaximumRetryAttempts: 0
      MaximumEventAgeInSeconds: 60
      DestinationConfig:
        OnFailure:
          Destination: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/default

  DeviceCommandRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: !Join ["_", [!Join ["_", !Split ["-", !Ref EnvironmentStackName]], virtual_quad_dcmd]]
      TopicRulePayload:
        AwsIotSqlVersion: "2016-03-23"
        RuleDisabled: false
        Sql: >-
          SELECT topic() AS mqttTopic, encode(*, 'base64') AS payloadBase64
          FROM 'spBv1.0/+/DCMD/+/+'
          WHERE startswith(topic(4), 'cloud-') AND startswith(topic(5), 'virtual-quad-')
        Actions:
          - Lambda: {FunctionArn: !GetAtt Controller.Arn}

  DeviceCommandPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Controller
      Principal: iot.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !GetAtt DeviceCommandRule.Arn

  SimulationShadowRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: !Join ["_", [!Join ["_", !Split ["-", !Ref EnvironmentStackName]], virtual_quad_shadow]]
      TopicRulePayload:
        AwsIotSqlVersion: "2016-03-23"
        RuleDisabled: false
        Sql: >-
          SELECT 'report' AS action, topic(3) AS deviceId
          FROM '$aws/things/+/shadow/name/simulation/update/documents'
          WHERE startswith(topic(3), 'virtual-quad-')
        Actions:
          - Lambda: {FunctionArn: !GetAtt Controller.Arn}

  SimulationShadowPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Controller
      Principal: iot.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !GetAtt SimulationShadowRule.Arn

  InvocationFailureRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName: default
      EventPattern:
        source: [lambda]
        detail-type: ['Lambda Function Invocation Result - Failure']
        resources:
          - !GetAtt Controller.Arn
          - !Sub '${Controller.Arn}:$LATEST'
        detail:
          requestPayload:
            mqttTopic: [{exists: true}]
            payloadBase64: [{exists: true}]
      Targets:
        - Id: finalize-failed-session
          Arn: !GetAtt Controller.Arn

  InvocationFailurePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Controller
      Principal: events.amazonaws.com
      SourceArn: !GetAtt InvocationFailureRule.Arn

Outputs:
  ArtifactBucket:
    Value: !Ref LambdaArtifactsBucketName
  ControllerFunction:
    Value: !Ref Controller
